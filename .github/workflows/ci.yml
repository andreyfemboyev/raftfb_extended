name: Isolated RaftDBX benchmark
on:
  push:
    branches:
      - benchmark/isolated-2026-11-27
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Measure hardware and run official benchmark
        run: |
          lscpu
          free -h
          python -m raftdb benchmark | tee benchmark-default.json
          python -m raftdb benchmark --rows 5000 --reads 1000 --updates 1000 | tee benchmark-large.json
      - uses: actions/upload-artifact@v4
        with:
          name: raftdbx-benchmark
          path: benchmark-*.json
