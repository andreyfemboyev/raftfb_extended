name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m compileall -q raftdb tests benchmarks
      - run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - run: python -m pip wheel --no-deps --wheel-dir dist/wheels .
